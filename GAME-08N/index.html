<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نششرة اللاعبين - GAME-08N</title>
  
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent-color: #3b82f6;
      --green: #22c55e;
      --red: #ef4444;
      --gold: #f59e0b;
      --text-color: #f8fafc;
    }

    * { box-sizing: border-box; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; margin: 0; padding: 0; }
    body { background-color: var(--bg-color); color: var(--text-color); padding: 15px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
    .container { width: 100%; max-width: 600px; }
    .header-tag { text-align: center; background-color: #334155; color: var(--gold); font-size: 0.85rem; padding: 4px 12px; border-radius: 20px; width: fit-content; margin: 0 auto 10px auto; font-weight: bold; }
    h1, h2, h3 { text-align: center; margin-bottom: 15px; color: #60a5fa; }
    .card { background-color: var(--card-bg); border-radius: 12px; padding: 15px; margin-bottom: 15px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3); }
    .setup-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
    label { font-size: 0.9rem; color: #94a3b8; display: block; margin-bottom: 4px; }
    input, select, button { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #334155; background-color: #0f172a; color: var(--text-color); font-size: 1rem; outline: none; }
    input:focus, select:focus { border-color: var(--accent-color); }
    .btn { background-color: var(--accent-color); color: white; font-weight: bold; border: none; cursor: pointer; border-radius: 8px; padding: 12px; transition: opacity 0.2s; }
    .btn:hover { opacity: 0.9; }
    .btn-green { background-color: var(--green); }
    .btn-red { background-color: var(--red); }
    .btn-reset { background-color: #475569; margin-top: 10px; }
    .btn-gold { background-color: var(--gold); color: #000; font-weight: bold; }
    .btn-whatsapp { background-color: #25D366; color: #fff; font-weight: bold; margin-top: 10px; }

    .online-badge { background-color: #065f46; color: #34d399; font-size: 0.85rem; padding: 8px 12px; border-radius: 8px; text-align: center; margin-bottom: 10px; font-weight: bold; }

    .players-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 15px; }
    .player-card { background-color: #334155; padding: 12px; border-radius: 10px; text-align: center; cursor: pointer; border: 2px solid transparent; transition: all 0.2s; }
    .player-card.selected { border-color: var(--gold); background-color: #1e293b; transform: scale(1.02); }
    .player-name { font-weight: bold; font-size: 1.1rem; margin-bottom: 5px; color: #cbd5e1; }
    .player-score { font-size: 1.8rem; font-weight: bold; color: #38bdf8; }
    .action-btns { display: flex; gap: 10px; margin-top: 10px; }

    .back-nav { margin-bottom: 10px; text-align: right; }
    .back-nav a { color: #94a3b8; text-decoration: none; font-size: 0.9rem; }
  </style>
</head>
<body>

<div class="container">
  <div class="back-nav"><a href="../index.html">➔ العودة لمنصة الألعاب</a></div>
  <div class="header-tag">GAME-08N • أونلاين مباشر</div>
  <h1>نششرة اللاعبين</h1>

  <!-- شاشة الإعداد -->
  <div id="setup-screen" class="card">
    <div style="background-color: #0f172a; padding: 12px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #334155;">
      <h3 style="color: var(--gold); font-size: 1rem; margin-bottom: 8px;">🔗 الانضمام لنشرة بواسطة رمز الغرفة</h3>
      <div style="display: flex; gap: 8px;">
        <input type="text" id="room-code-input" placeholder="أدخل رمز الغرفة (مثال: 5892)">
        <button class="btn btn-gold" style="width: 120px;" onclick="joinRoomByCode()">دخول 🚀</button>
      </div>
    </div>

    <hr style="border-color: #334155; margin-bottom: 15px;">

    <h3 style="font-size: 1.05rem; margin-bottom: 10px;">إنشاء نشرة جديدة:</h3>
    <div style="margin-bottom: 15px;">
      <label>عدد اللاعبين:</label>
      <select id="player-count-select" onchange="generateNameInputs()">
        <option value="2">2 لاعبين</option>
        <option value="3">3 لاعبين</option>
        <option value="4">4 لاعبين</option>
        <option value="5">5 لاعبين</option>
        <option value="6">6 لاعبين</option>
        <option value="7">7 لاعبين</option>
        <option value="8" selected>8 لاعبين</option>
      </select>
    </div>

    <label style="margin-bottom: 8px;">أسماء اللاعبين:</label>
    <div class="setup-grid" id="names-inputs"></div>

    <div style="margin-bottom: 15px;">
      <label>هدف الفوز (مضاعفات 1000):</label>
      <select id="target-score-select">
        <option value="1000">1000</option>
        <option value="2000">2000</option>
        <option value="3000">3000</option>
        <option value="4000">4000</option>
        <option value="5000">5000</option>
      </select>
    </div>

    <button class="btn btn-green" onclick="createRoom()">بدء النشرة 🚀</button>
  </div>

  <!-- شاشة اللعب -->
  <div id="game-screen" style="display: none;">
    <div id="online-status" class="online-badge"></div>

    <!-- زر مشاركة النشرة -->
    <button class="btn btn-whatsapp" onclick="shareRoomWhatsApp()">📲 مشاركة النشرة عبر الواتساب</button>

    <div class="players-grid" id="players-grid" style="margin-top: 15px;"></div>

    <div class="card">
      <h3 style="margin-bottom: 10px; color: #60a5fa;">التحكم بالنقط</h3>
      <label>اختر اللاعب:</label>
      <select id="player-select" onchange="highlightPlayerCard(this.value)"></select>

      <label style="margin-top: 10px;">المبلغ المراد إضافته أو تنقيصه:</label>
      <input type="number" id="score-amount" placeholder="أدخل النقاط (مثال: 50، 100)" min="1">

      <div class="action-btns">
        <button class="btn btn-green" onclick="modifyScore('add')">+ زيادة</button>
        <button class="btn btn-red" onclick="modifyScore('subtract')">- تنقيص</button>
      </div>
    </div>

    <button class="btn btn-reset" onclick="exitRoom()">خروج وإعادة ضبط 🔄</button>
  </div>
</div>

<script>
  let db = null;
  try {
    const firebaseConfig = { databaseURL: "https://nashra-game-default-rtdb.firebaseio.com" };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    db = firebase.database();
  } catch(e) { console.log("Firebase Error"); }

  let currentRoomId = null;
  let players = [];
  let targetScore = 1000;
  let selectedPlayerIndex = 0;

  function generateNameInputs() {
    const count = parseInt(document.getElementById('player-count-select').value);
    const container = document.getElementById('names-inputs');
    container.innerHTML = '';
    for (let i = 0; i < count; i++) {
      container.innerHTML += `<div><label>اللاعب ${i + 1}:</label><input type="text" id="pname-${i}" value="لاعب ${i + 1}"></div>`;
    }
  }
  generateNameInputs();

  // الفحص التلقائي للرابط إذا دخل المتسابق عبر رابط مشاركة
  window.onload = function() {
    const urlParams = new URLSearchParams(window.location.search);
    const roomFromUrl = urlParams.get('room');
    if (roomFromUrl) {
      joinRoomByCode(roomFromUrl);
    }
  };

  function createRoom() {
    const count = parseInt(document.getElementById('player-count-select').value);
    players = [];
    for (let i = 0; i < count; i++) {
      const name = document.getElementById(`pname-${i}`).value.trim() || `لاعب ${i + 1}`;
      players.push({ name: name, score: 100 });
    }

    targetScore = parseInt(document.getElementById('target-score-select').value);
    currentRoomId = Math.floor(1000 + Math.random() * 9000).toString();

    openGameView();

    if (db) {
      db.ref('rooms/' + currentRoomId).set({
        targetScore: targetScore,
        players: players
      });
      document.getElementById('online-status').innerText = `🟢 متصل أونلاين | رمز الغرفة: ${currentRoomId}`;
      listenToRoom();
    }
  }

  function joinRoomByCode(code) {
    const roomId = code || document.getElementById('room-code-input').value.trim();
    if (!roomId) {
      alert("يرجى إدخال رمز الغرفة!");
      return;
    }

    if (db) {
      db.ref('rooms/' + roomId).once('value', (snapshot) => {
        const data = snapshot.val();
        if (data) {
          currentRoomId = roomId;
          players = data.players || [];
          targetScore = data.targetScore || 1000;
          openGameView();
          document.getElementById('online-status').innerText = `🟢 متصل بالنشرة | رمز الغرفة: ${currentRoomId}`;
          listenToRoom();
        } else {
          alert("رمز الغرفة غير موجود!");
        }
      });
    }
  }

  function listenToRoom() {
    if (db && currentRoomId) {
      db.ref('rooms/' + currentRoomId + '/players').on('value', (snapshot) => {
        const data = snapshot.val();
        if (data) {
          players = data;
          renderPlayers();
          updatePlayerDropdown();
        }
      });
    }
  }

  function openGameView() {
    document.getElementById('setup-screen').style.display = 'none';
    document.getElementById('game-screen').style.display = 'block';
    renderPlayers();
    updatePlayerDropdown();
  }

  function shareRoomWhatsApp() {
    const shareUrl = window.location.href.split('?')[0] + '?room=' + currentRoomId;
    const message = `انضم لنشرة اللعب المباشرة 🃏\nرمز الغرفة: ${currentRoomId}\nالرابط المباشر:\n${shareUrl}`;
    window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(message)}`, '_blank');
  }

  function renderPlayers() {
    const grid = document.getElementById('players-grid');
    grid.innerHTML = '';
    players.forEach((p, index) => {
      const isSelected = index === selectedPlayerIndex ? 'selected' : '';
      grid.innerHTML += `
        <div class="player-card ${isSelected}" onclick="selectPlayer(${index})">
          <div class="player-name">${p.name}</div>
          <div class="player-score">${p.score}</div>
        </div>
      `;
    });
  }

  function updatePlayerDropdown() {
    const select = document.getElementById('player-select');
    select.innerHTML = '';
    players.forEach((p, index) => {
      select.innerHTML += `<option value="${index}">${p.name} (رصيده: ${p.score})</option>`;
    });
    select.value = selectedPlayerIndex;
  }

  function selectPlayer(index) {
    selectedPlayerIndex = index;
    document.getElementById('player-select').value = index;
    renderPlayers();
  }

  function highlightPlayerCard(index) {
    selectedPlayerIndex = parseInt(index);
    renderPlayers();
  }

  function modifyScore(type) {
    const amountInput = document.getElementById('score-amount');
    const amount = parseInt(amountInput.value);
    if (isNaN(amount) || amount <= 0) return;

    if (type === 'add') {
      players[selectedPlayerIndex].score += amount;
    } else {
      players[selectedPlayerIndex].score -= amount;
    }

    amountInput.value = '';
    renderPlayers();
    updatePlayerDropdown();

    if (db && currentRoomId) {
      db.ref('rooms/' + currentRoomId + '/players').set(players);
    }
  }

  function exitRoom() {
    if (db && currentRoomId) {
      db.ref('rooms/' + currentRoomId).off();
    }
    document.getElementById('game-screen').style.display = 'none';
    document.getElementById('setup-screen').style.display = 'block';
  }
</script>
</body>
</html>
