<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام تقييم الأداء الوظيفي - جمعية النبهانية للخدمات الإنسانية والاجتماعية</title>
    <style>
        :root {
            --primary-color: #065F46;
            --secondary-color: #D97706;
            --bg-color: #F8FAFC;
            --card-bg: #FFFFFF;
            --text-color: #1E293B;
            --border-color: #CBD5E1;
        }

        * { box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 950px;
            background: var(--card-bg);
            border-radius: 16px;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            padding: 24px;
        }

        .header {
            text-align: center;
            border-bottom: 2px solid var(--primary-color);
            padding-bottom: 14px;
            margin-bottom: 20px;
        }
        .header h1 { color: var(--primary-color); font-size: 20px; margin: 0 0 4px 0; }
        .header h2 { color: var(--secondary-color); font-size: 15px; margin: 0; font-weight: 600; }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 14px;
            background: #F1F5F9;
            padding: 14px;
            border-radius: 12px;
            margin-bottom: 20px;
        }
        .form-group { display: flex; flex-direction: column; text-align: right; }
        .form-group label { font-size: 12px; font-weight: bold; margin-bottom: 4px; color: #475569; }
        .form-group input, .form-group select {
            padding: 8px 10px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            font-size: 13px;
            outline: none;
            background: #FFF;
        }

        .section-title {
            font-size: 15px;
            color: var(--primary-color);
            border-right: 4px solid var(--secondary-color);
            padding-right: 8px;
            margin: 16px 0 10px 0;
            font-weight: bold;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
            font-size: 12px;
        }
        th, td { border: 1px solid var(--border-color); padding: 8px; text-align: right; }
        th { background-color: #F1F5F9; color: #334155; }
        td select { width: 100%; padding: 4px; border-radius: 4px; border: 1px solid #CBD5E1; }

        .result-box {
            background: #ECFDF5;
            border: 1px solid #10B981;
            border-radius: 12px;
            padding: 14px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            margin-bottom: 20px;
        }
        .score-val { font-size: 22px; font-weight: bold; color: var(--primary-color); }
        .grade-badge { font-size: 16px; font-weight: bold; color: var(--secondary-color); }

        .signatures {
            display: flex;
            justify-content: space-between;
            margin-top: 30px;
            padding-top: 16px;
            border-top: 1px dashed var(--border-color);
            font-size: 12px;
            text-align: center;
        }
        .sig-box { flex: 1; line-height: 1.6; }

        .btn-print {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: 0.2s;
        }
        .btn-print:hover { background-color: #047857; }

        @media print {
            body { padding: 0; background: white; }
            .container { border: none; box-shadow: none; width: 100%; max-width: 100%; }
            .btn-print { display: none; }
            select { border: none; background: transparent; appearance: none; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>جمعية النبهانية للخدمات الإنسانية والاجتماعية</h1>
        <h2>استمارة تقييم الأداء الوظيفي التخصصية (30 معياراً)</h2>
    </div>

    <!-- الإدخالات الرئيسية -->
    <div class="info-grid">
        <div class="form-group">
            <label>المسمى الوظيفي</label>
            <select id="job-title-select" onchange="onJobChange()">
                <option value="exec">مدير تنفيذي</option>
                <option value="gov_fund">أخصائي حوكمة ومدير تنمية موارد مالية</option>
                <option value="pm">مدير مشاريع</option>
                <option value="accountant">محاسب</option>
                <option value="researcher_m">باحث اجتماعي</option>
                <option value="researcher_f">باحثة اجتماعية</option>
                <option value="tech_dir">مدير تقني</option>
                <option value="worker">عامل تحميل وتنزيل</option>
            </select>
        </div>
        <div class="form-group">
            <label>اسم الموظف</label>
            <select id="emp-name-select">
                <option>محمد سليمان الغانم</option>
                <option>محمد غازي المطرفي</option>
                <option>محمد ضيف الله المطرفي</option>
                <option>طلال عبدالله الحربي</option>
                <option>خليفه علي الحصنان</option>
                <option>حنان نفاع الحربي</option>
                <option>فهد حمد العلوي</option>
                <option>أحمد محمد البكاوي</option>
            </select>
        </div>
        <div class="form-group">
            <label>فترة التقييم</label>
            <select id="eval-period">
                <option>الربع الأول</option>
                <option>الربع الثاني</option>
                <option>الربع الثالث</option>
                <option>الربع الرابع</option>
                <option>التقييم السنوي الشامل</option>
            </select>
        </div>
    </div>

    <!-- جدول الـ 30 سؤالاً -->
    <div class="section-title">بنود ومعايير التقييم التخصصية (30 سؤالاً)</div>
    <table>
        <thead>
            <tr>
                <th style="width: 5%;">#</th>
                <th style="width: 65%;">المعيار التخصصي للوظيفة والعمل بالجمعية</th>
                <th style="width: 30%;">التقييم المستحق</th>
            </tr>
        </thead>
        <tbody id="questions-table-body">
            <!-- يتم توليد الـ 30 سؤالاً ديناميكياً هنا -->
        </tbody>
    </table>

    <!-- النتيجة والتقدير -->
    <div class="result-box">
        <div>
            <div style="font-size: 12px; color: #475569;">المجموع الكلي:</div>
            <div class="score-val" id="total-score">100 / 100</div>
        </div>
        <div>
            <div style="font-size: 12px; color: #475569;">التقدير العام:</div>
            <div class="grade-badge" id="grade-badge">ممتاز 🌟</div>
        </div>
    </div>

    <!-- التوقيعات والاعتمادات حسب الوظيفة -->
    <div class="signatures" id="signatures-box">
        <!-- يتم تغيير جهات التوقيع تلقائياً -->
    </div>

    <br>
    <button class="btn-print" onclick="window.print()">طباعة / حفظ استمارة التقييم PDF 🖨️</button>
</div>

<script>
    // بنك الأسئلة الـ 30 تخصصية بحسب احتياج جمعية النبهانية
    const JOB_QUESTIONS = {
        exec: [
            "متابعة وتنفيذ قرارات مجلس الإدارة الخططية", "إدارة وتوجيه الأقسام التنفيذية بالجمعية", "تطوير بيئة العمل وتحفيز فريق العمل",
            "تمثيل الجمعية أمام الجهات الرسمية والشريكة", "الإشراف على إعداد الميزانية السنوية وحوكمتها", "متابعة مؤشرات أداء البرامج الاجتماعية والإنسانية",
            "تحقيق مستهدفات الاستدامة المالية بالجمعية", "ضمان تطبيق أنظمة الحوكمة ومقاييس التميز", "تطوير العلاقات الاستراتيجية والداعمين",
            "الإشراف على التغطيات الإعلامية والاتصال المؤسسي", "متابعة السجلات الإدارية ونسب الإنجاز", "الاستجابة الحثيثة للمبادرات الطارئة بالمنطقة",
            "الالتزام بسياسات اللائحة الأساسية للجمعية", "تنفيذ برامج الشفافية والإفصاح المالي", "إدارة المخاطر التشغيلية والمالية بحزم",
            "متابعة جودة خدمات المستفيدين بالنبهانية", "الارتقاء بالفرص التطوعية واستقطاب المتطوعين", "عقد اجتماعات المتابعة الدورية للأقسام",
            "التأكد من التحديث المستمر لقواعد البيانات", "قيادة التحول الرقمي والتطوير التقني بالجمعية", "متابعة خطط الصرف والمساعدات الميدانية",
            "القدرة على حل المشكلات واتخاذ القرارات السليمة", "إعداد التقارير السنوية الختامية بدقة", "تفعيل الشراكات المجتمعية والمبادرات",
            "تنمية بيئة محفزة للابتكار والخدمة الاجتماعية", "المحافظة على أصول وتجهيزات الجمعية", "الالتزام بالأنظمة والمقاييس الوزارية",
            "قياس التغذية الراجعة ورضا المستفيدين", "الاهتمام بالتطوير المهني المستمر للكادر", "الانضباط والتواجد الإداري الفعال"
        ],
        default30: [
            "الالتزام بالدوام الرسمي وساعات العمل", "سرعة ودقة تنفيذ المهام الموكلة", "التعاون بروح الفريق الواحد مع الزملاء",
            "التواصل الفعال والمحترم مع المستفيدين والزوار", "المحافظة على أصول ممتلكات وأجهزة الجمعية", "الالتزام بتعليمات وتسلسلات الإدارة التنفيذية",
            "سرعة الإنجاز وتحمل ضغط العمل الميداني/الإداري", "المبادرة في تقديم أفكار لتطوير بيئة العمل", "الالتزام بالسرية التامة لبيانات المستفيدين",
            "حضور الاجتماعات والدورات التدريبية بفاعلية", "المرونة في أداء المهام الإضافية الموكلة", "الدقة في حفظ وصيانة الملفات والسجلات",
            "الالتزام بقواعد السلامة والصحة المهنية", "جودة وتنسيق المخرجات والتقارير الدورية", "حسن التصرف في الحالات الطارئة ومتابعتها",
            "استخدام التقنية والأدوات الذكية بمهارة", "الاهتمام بالمظهر العام والهندام المهني", "التقيد باللائحة الداخلية للجمعية",
            "المساهمة في دعم البرامج والمبادرات المجتمعية", "متابعة استكمال النماذج والأوراق المعتمدة", "تقبل التوجيهات والملاحظات من الرؤساء",
            "التنسيق المباشر والمستمر مع الأقسام ذات العلاقة", "القدرة على ترتيب الأولويات التشغيلية", "التركيز على رضا أصحاب المصلحة والمستفيدين",
            "الالتزام بمعايير الحوكمة والنزاهة الوظيفية", "استغلال وقت العمل بشكل إيجابي ومنتج", "تحديث البيانات بصفة دورية ودقيقة",
            "القدرة على العمل بشكل مستقل وبكفاءة", "الإسهام في إنجاز خطط القسم المحددة", "المظهر التنافسي والإخلاص في خدمة المجتمع"
        ]
    };

    function onJobChange() {
        let job = document.getElementById('job-title-select').value;
        renderQuestions(job);
        renderSignatures(job);
    }

    function renderQuestions(job) {
        let tbody = document.getElementById('questions-table-body');
        tbody.innerHTML = '';
        let list = (job === 'exec') ? JOB_QUESTIONS.exec : JOB_QUESTIONS.default30;

        list.forEach((qText, idx) => {
            tbody.innerHTML += `
                <tr>
                    <td>${idx + 1}</td>
                    <td>${qText}</td>
                    <td>
                        <select class="score-input" onchange="calculateScore()">
                            <option value="3.33">ممتاز جداً (كامل)</option>
                            <option value="2.66">جيد جداً</option>
                            <option value="2.00">جيد</option>
                            <option value="1.33">مقبول</option>
                            <option value="0.66">ضعيف</option>
                        </select>
                    </td>
                </tr>`;
        });
        calculateScore();
    }

    function calculateScore() {
        let inputs = document.querySelectorAll('.score-input');
        let total = 0;
        inputs.forEach(sel => { total += parseFloat(sel.value); });
        
        let rounded = Math.min(100, Math.round(total));
        document.getElementById('total-score').innerText = rounded + " / 100";

        let badge = document.getElementById('grade-badge');
        if (rounded >= 90) { badge.innerText = "ممتاز 🌟"; badge.style.color = "#065F46"; }
        else if (rounded >= 80) { badge.innerText = "جيد جداً 👍"; badge.style.color = "#2563EB"; }
        else if (rounded >= 70) { badge.innerText = "جيد 🟢"; badge.style.color = "#D97706"; }
        else if (rounded >= 60) { badge.innerText = "مقبول 🟠"; badge.style.color = "#E11D48"; }
        else { badge.innerText = "ضعيف 🔴"; badge.style.color = "#991B1B"; }
    }

    function renderSignatures(job) {
        let sigBox = document.getElementById('signatures-box');
        if (job === 'exec') {
            sigBox.innerHTML = `
                <div class="sig-box">
                    <strong>عضو لجنة الحوكمة والتقييم والمراجعة</strong><br><br>
                    الاسم: .......................................<br>
                    التوقيع: ....................................
                </div>
                <div class="sig-box">
                    <strong>رئيس مجلس الإدارة</strong><br><br>
                    الأستاذ: خالد بن ضيف الله المطرفي<br>
                    التوقيع: ....................................
                </div>`;
        } else {
            sigBox.innerHTML = `
                <div class="sig-box">
                    <strong>اعتماد المدير التنفيذي</strong><br><br>
                    التوقيع: ....................................
                </div>
                <div class="sig-box">
                    <strong>مصادقة رئيس مجلس الإدارة</strong><br><br>
                    الأستاذ: خالد بن ضيف الله المطرفي<br>
                    التوقيع: ....................................
                </div>`;
        }
    }

    // تشغيل عند الفتح
    window.onload = function() {
        onJobChange();
    };
</script>

</body>
</html>
