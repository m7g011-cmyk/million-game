<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الألعاب الأونلاين 🎮</title>
    <style>
        body { 
            background-color: #0F172A; 
            color: white; 
            font-family: system-ui, -apple-system, sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            padding: 16px; 
            box-sizing: border-box; 
        }
        .card { 
            background: #1E293B; 
            border: 1px solid #F59E0B; 
            border-radius: 16px; 
            padding: 24px; 
            width: 100%; 
            max-width: 400px; 
            text-align: center; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.5); 
        }
        h1 { color: #F59E0B; margin-bottom: 8px; font-size: 24px; }
        p { color: #94A3B8; font-size: 14px; margin-bottom: 20px; }
        .game-btn { 
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%; 
            padding: 14px; 
            margin: 10px 0; 
            border-radius: 12px; 
            border: none; 
            font-weight: bold; 
            font-size: 16px; 
            text-decoration: none; 
            box-sizing: border-box; 
            transition: all 0.2s ease; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .game-btn:active { transform: scale(0.97); }
        .btn-million { background: linear-gradient(135deg, #F59E0B, #D97706); color: #000; }
        .btn-baloot { background: linear-gradient(135deg, #10B981, #047857); color: #fff; }
        .btn-quiz { background: linear-gradient(135deg, #3B82F6, #1D4ED8); color: #fff; }
    </style>
</head>
<body>

<div class="card">
    <h1>بوابة الألعاب الأونلاين 🎮</h1>
    <p>اختر اللعبة وابدأ التحدي الآن</p>
    
    <a href="./million/index.html" class="game-btn btn-million">
        🃏 لعبة المليون أونلاين
    </a>
    
    <a href="./baloot/index.html" class="game-btn btn-baloot">
        ♠️ لعبة البلوت أونلاين
    </a>

    <a href="./quiz/index.html" class="game-btn btn-quiz">
        🏆 لعبة من سيربح المليون
    </a>
</div>

</body>
</html>
