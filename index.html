<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة المليون أونلاين</title>
    
    <!-- مكتبات Firebase السحابية للويب المباشر -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <style>
        body {
            background-color: #0F172A;
            color: white;
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .card {
            background-color: #1E293B;
            border: 1px solid #F59E0B;
            border-radius: 16px;
            padding: 20px;
            width: 100%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        h1 { color: #F59E0B; margin-bottom: 8px; font-size: 26px; }
        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border-radius: 8px;
            border: 1px solid #334155;
            background-color: #0F172A;
            color: white;
            box-sizing: border-box;
            font-size: 15px;
            text-align: center;
        }
        button {
            width: 100%;
            padding: 12px;
            margin: 6px 0;
            border-radius: 8px;
            border: none;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            transition: 0.2s;
        }
        button:active { transform: scale(0.98); }
        .btn-primary { background-color: #F59E0B; color: #000; }
        .btn-success { background-color: #10B981; color: #fff; }
        .btn-share { background-color: #3B82F6; color: #fff; }
        .btn-secondary { background-color: #64748B; color: #fff; }
        .btn-danger { background-color: #EF4444; color: #fff; }
        .btn-bot { background-color: #8B5CF6; color: #fff; }
        
        .invite-box {
            background-color: rgba(16, 185, 129, 0.15);
            border: 1px solid #10B981;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 12px;
            font-size: 14px;
            color: #34D399;
        }
        .players-list {
            background-color: #0F172A;
            border: 1px solid #334155;
            border-radius: 10px;
            padding: 10px;
            margin: 15px 0;
            text-align: right;
        }
        .player-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            margin: 4px 0;
            background: #1E293B;
            border-radius: 6px;
            font-size: 14px;
        }
        .player-item.host { border-right: 3px solid #F59E0B; }
        .badge {
            font-size: 11px;
            padding: 2px 6px;
            border-radius: 4px;
            background-color: #334155;
            color: #CBD5E1;
        }
        .status-dot {
            height: 8px;
            width: 8px;
            background-color: #10B981;
            border-radius: 50%;
            display: inline-block;
            margin-left: 6px;
        }
        .hidden { display: none; }
        .flex-row { display: flex; gap: 8px; }
    </style>
</head>
<body>

<div class="card">
    <h1>لعبة المليون 🃏</h1>

    <!-- 1. شاشة اللوبي والدخول -->
    <div id="lobby-screen">
        <div id="invite-alert" class="invite-box hidden">
            🎯 وصلتك دعوة للانضمام للغرفة رقم: <strong id="invite-code-text"></strong>
        </div>

        <input type="text" id="player-name" placeholder="اكتب اسمك للبدء" />
        
        <div id="normal-controls">
            <button class="btn-primary" onclick="createRoom()">إنشاء غرفة أونلاين جديدة</button>
            <button class="btn-bot" onclick="startVsBots()">اللعب بمفردك ضد الكمبيوتر 🤖</button>
            
            <hr style="border-color: #334155; margin: 15px 0;">
            <input type="number" id="room-code-input" placeholder="أدخل رمز الغرفة" />
            <button class="btn-success" onclick="joinRoom()">انضمام لغرفة أونلاين</button>
        </div>

        <div id="invite-controls" class="hidden">
            <button class="btn-success" onclick="joinDirectRoom()">دخول مباشر للغرفة 🚀</button>
        </div>
    </div>

    <!-- 2. شاشة الانتظار وإدارة اللاعبين -->
    <div id="waiting-screen" class="hidden">
        <h3>رمز الغرفة: <span id="current-room-display" style="color:#F59E0B;"></span></h3>
        <p style="font-size: 14px; color: #94A3B8;">
            <span class="status-dot"></span> متصل بالسيرفر | المتواجدون (<span id="player-count">1</span>/4)
        </p>

        <!-- قائمة الأسماء المحدثة لحظياً عبر Firebase -->
        <div class="players-list">
            <div style="font-size: 13px; color: #F59E0B; margin-bottom: 6px; font-weight: bold;">اللاعبون المتواجدون الآن:</div>
            <div id="players-container"></div>
        </div>

        <button class="btn-share" onclick="shareInviteLink()">مشاركة رابط الدعوة 🔗</button>
        
        <div class="flex-row">
            <button class="btn-secondary" onclick="addManualPlayer()">إضافة لاعب يدوي 👤</button>
            <button class="btn-bot" onclick="fillWithBots()">إكمال بالكمبيوتر 🤖</button>
        </div>

        <button id="start-game-btn" class="btn-primary hidden" style="margin-top: 12px;" onclick="startGame()">بدء اللعب الآن 🚀</button>
        <button class="btn-danger" style="margin-top: 8px;" onclick="leaveRoom()">مغادرة الغرفة 🚪</button>
    </div>

    <!-- 3. شاشة طاولة اللعب -->
    <div id="game-screen" class="hidden">
        <h3 style="color: #10B981;">بدأت المباراة أونلاين! 🃏</h3>
        <div id="game-board-players" class="players-list"></div>
        <p style="color: #F59E0B; font-size: 14px;">جاري مزامنة توزيع الأوراق أونلاين...</p>
        <button class="btn-danger" onclick="leaveRoom()">الخروج للرئيسية ↩️</button>
    </div>
</div>

<script>
    // تهيئة Firebase ببياناتك السحابية المباشرة
    const firebaseConfig = {
        apiKey: "AIzaSyBRtQGiXgrzm7SoFwymT39OBZVtN0Pz-Ys",
        authDomain: "million-game-1ec89.firebaseapp.com",
        databaseURL: "https://million-game-1ec89-default-rtdb.firebaseio.com",
        projectId: "million-game-1ec89",
        storageBucket: "million-game-1ec89.firebasestorage.app",
        messagingSenderId: "6658146268",
        appId: "1:6658146268:web:0467d3f63e11b818fb9919"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let currentRoomCode = null;
    let myName = "";
    let isHost = false;
    let autoCode = new URLSearchParams(window.location.search).get('code');

    window.onload = function() {
        let savedName = localStorage.getItem('million_player_name');
        if (savedName) document.getElementById('player-name').value = savedName;

        if (autoCode) {
            document.getElementById('invite-alert').classList.remove('hidden');
            document.getElementById('invite-controls').classList.remove('hidden');
            document.getElementById('normal-controls').classList.add('hidden');
            document.getElementById('invite-code-text').innerText = autoCode;
        }
    };

    function saveName(name) {
        myName = name;
        localStorage.setItem('million_player_name', name);
    }

    // إنشاء غرفة وتخزينها في قاعدة البيانات السحابية
    function createRoom() {
        let name = document.getElementById('player-name').value.trim();
        if (!name) return alert('أدخل اسمك أولاً!');
        saveName(name);

        isHost = true;
        currentRoomCode = Math.floor(1000 + Math.random() * 9000).toString();
        
        let roomRef = db.ref('rooms/' + currentRoomCode);
        roomRef.set({
            status: 'waiting',
            players: [{ name: name, isHost: true, type: 'حقيقي' }]
        }).then(() => {
            listenToRoomUpdates(currentRoomCode);
            openWaitingScreen();
        });
    }

    // الانضمام لغرفة أونلاين ومزامنة اسمك مع المضيف
    function joinRoom() {
        let name = document.getElementById('player-name').value.trim();
        let code = document.getElementById('room-code-input').value.trim();
        if (!name || !code) return alert('أدخل الاسم ورقم الغرفة!');
        saveName(name);
        
        performJoin(code, name);
    }

    function joinDirectRoom() {
        let name = document.getElementById('player-name').value.trim();
        if (!name) return alert('أدخل اسمك أولاً!');
        saveName(name);

        performJoin(autoCode, name);
    }

    function performJoin(code, name) {
        currentRoomCode = code;
        let roomRef = db.ref('rooms/' + code);
        
        roomRef.get().then((snapshot) => {
            if (snapshot.exists()) {
                let roomData = snapshot.val();
                let playersList = roomData.players || [];

                if (playersList.length >= 4) return alert('الغرفة مكتملة بـ 4 لاعبين!');

                playersList.push({ name: name, isHost: false, type: 'حقيقي' });
                roomRef.update({ players: playersList }).then(() => {
                    listenToRoomUpdates(code);
                    openWaitingScreen();
                });
            } else {
                alert('الغرفة غير موجودة! التأكد من رمز الغرفة.');
            }
        });
    }

    // الاستماع المباشر للتغييرات أونلاين (عند انضمام أي صديق تظهر شاشته عندك فوراً)
    function listenToRoomUpdates(code) {
        db.ref('rooms/' + code).on('value', (snapshot) => {
            if (!snapshot.exists()) return;
            let data = snapshot.val();
            
            if (data.status === 'playing') {
                openGameScreen(data.players);
            } else {
                updatePlayersUI(data.players || []);
            }
        });
    }

    function updatePlayersUI(players) {
        document.getElementById('player-count').innerText = players.length;
        let container = document.getElementById('players-container');
        container.innerHTML = '';

        players.forEach((p, index) => {
            let item = document.createElement('div');
            item.className = `player-item ${p.isHost ? 'host' : ''}`;
            item.innerHTML = `
                <span><strong>${index + 1}.</strong> ${p.name}</span>
                <span class="badge">${p.isHost ? 'المضيف 👑' : p.type}</span>
            `;
            container.appendChild(item);
        });

        if (players.length === 4 && isHost) {
            document.getElementById('start-game-btn').classList.remove('hidden');
        } else {
            document.getElementById('start-game-btn').classList.add('hidden');
        }
    }

    function addManualPlayer() {
        let roomRef = db.ref('rooms/' + currentRoomCode + '/players');
        roomRef.get().then((snapshot) => {
            let playersList = snapshot.val() || [];
            if (playersList.length >= 4) return alert('الغرفة مكتملة!');
            
            let name = prompt('أدخل اسم اللاعب الإضافي:', `لاعب ${playersList.length + 1}`);
            if (name && name.trim() !== '') {
                playersList.push({ name: name.trim(), isHost: false, type: 'يدوي' });
                roomRef.set(playersList);
            }
        });
    }

    function fillWithBots() {
        let roomRef = db.ref('rooms/' + currentRoomCode + '/players');
        roomRef.get().then((snapshot) => {
            let playersList = snapshot.val() || [];
            let botCount = 1;
            while (playersList.length < 4) {
                playersList.push({ name: `بوت ${botCount} 🤖`, isHost: false, type: 'آلي' });
                botCount++;
            }
            roomRef.set(playersList);
        });
    }

    function startVsBots() {
        let name = document.getElementById('player-name').value.trim() || 'اللاعب';
        saveName(name);
        let players = [
            { name: name, isHost: true, type: 'حقيقي' },
            { name: 'الكمبيوتر 1 🤖', isHost: false, type: 'آلي' },
            { name: 'الكمبيوتر 2 🤖', isHost: false, type: 'آلي' },
            { name: 'الكمبيوتر 3 🤖', isHost: false, type: 'آلي' }
        ];
        openGameScreen(players);
    }

    function startGame() {
        db.ref('rooms/' + currentRoomCode).update({ status: 'playing' });
    }

    function openWaitingScreen() {
        document.getElementById('lobby-screen').classList.add('hidden');
        document.getElementById('waiting-screen').classList.remove('hidden');
        document.getElementById('current-room-display').innerText = currentRoomCode;
    }

    function openGameScreen(playersList) {
        document.getElementById('lobby-screen').classList.add('hidden');
        document.getElementById('waiting-screen').classList.add('hidden');
        document.getElementById('game-screen').classList.remove('hidden');

        let container = document.getElementById('game-board-players');
        container.innerHTML = '<div style="font-size:13px; color:#F59E0B; margin-bottom:6px;">اللاعبون المباشرون أونلاين:</div>';
        playersList.forEach((p, i) => {
            container.innerHTML += `<div class="player-item"><span>${i + 1}. ${p.name}</span><span class="badge">50,000 $</span></div>`;
        });
    }

    function shareInviteLink() {
        let url = window.location.origin + window.location.pathname + '?code=' + currentRoomCode;
        navigator.clipboard.writeText(url).then(() => {
            alert('تم نسخ رابط الدعوة الأونلاين! أرسله بالواتساب لأصدقائك للانضمام فوراً 🔗');
        });
    }

    function leaveRoom() {
        location.href = window.location.origin + window.location.pathname;
    }
</script>

</body>
</html>
