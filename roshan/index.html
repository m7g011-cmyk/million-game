<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>دوري روشن السعودي 2026م ⚽</title>
    <style>
        * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
        body { 
            background: radial-gradient(circle, #1E1B4B 0%, #0F172A 100%); 
            color: white; 
            margin: 0; 
            padding: 12px; 
            display: flex; 
            justify-content: center; 
            min-height: 100vh; 
        }
        .roshan-card { 
            background: rgba(15, 23, 42, 0.95); 
            border: 2px solid #F59E0B; 
            border-radius: 20px; 
            padding: 16px; 
            width: 100%; 
            max-width: 480px; 
            text-align: center; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.8); 
        }
        h1 { color: #F59E0B; font-size: 20px; margin: 0 0 4px 0; }
        .season-badge { color: #10B981; font-size: 13px; font-weight: bold; margin-bottom: 12px; }
        
        .tab-bar { 
            display: flex; 
            gap: 4px; 
            background: #1E293B; 
            padding: 4px; 
            border-radius: 12px; 
            margin-bottom: 14px; 
        }
        .tab-btn { 
            flex: 1; 
            padding: 8px 4px; 
            border: none; 
            background: transparent; 
            color: #94A3B8; 
            font-size: 11px; 
            font-weight: bold; 
            border-radius: 8px; 
            cursor: pointer; 
        }
        .tab-btn.active { background: #F59E0B; color: #000; }

        .table-container {
            max-height: 480px;
            overflow-y: auto;
            border: 1px solid #334155;
            border-radius: 12px;
        }

        table { width: 100%; border-collapse: collapse; font-size: 12px; text-align: right; }
        th, td { padding: 10px 8px; border-bottom: 1px solid #334155; }
        th { color: #F59E0B; background: #0F172A; position: sticky; top: 0; z-index: 2; }
        tr:nth-child(even) { background: rgba(255,255,255,0.03); }

        .rank-badge { 
            display: inline-block; 
            width: 22px; 
            height: 22px; 
            line-height: 22px; 
            text-align: center; 
            border-radius: 50%; 
            font-weight: bold; 
            font-size: 11px; 
        }
        .top-1 { background: #F59E0B; color: #000; }
        .top-4 { background: #10B981; color: #fff; }

        .btn-back {
            display: block;
            width: 100%;
            padding: 10px;
            margin-top: 14px;
            background: #334155;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
            font-size: 13px;
        }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="roshan-card">
    <h1>دوري روشن السعودي 🇸🇦 ⚽</h1>
    <div class="season-badge">الموسم المعتمد لعام 2026م</div>

    <div class="tab-bar">
        <button class="tab-btn active" onclick="switchTab('standings', this)">جدول الترتيب والنقاط</button>
        <button class="tab-btn" onclick="switchTab('scorers', this)">قائمة الهدافين 2026م</button>
    </div>

    <!-- 1. جدول ترتيب الدوري لعام 2026م -->
    <div id="standings-view" class="table-container">
        <table>
            <thead>
                <tr>
                    <th>#</th>
                    <th>الفريق</th>
                    <th>لعب</th>
                    <th>الفرق</th>
                    <th>نقاط</th>
                </tr>
            </thead>
            <tbody id="standings-data"></tbody>
        </table>
    </div>

    <!-- 2. جدول الهدافين لعام 2026م -->
    <div id="scorers-view" class="table-container hidden">
        <table>
            <thead>
                <tr>
                    <th>#</th>
                    <th>اللاعب</th>
                    <th>الفريق</th>
                    <th>الأهداف</th>
                </tr>
            </thead>
            <tbody id="scorers-data"></tbody>
        </table>
    </div>

    <a href="../index.html" class="btn-back">العودة للبوابة الرئيسية 🏠</a>
</div>

<script>
    function switchTab(viewId, btn) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');

        ['standings', 'scorers'].forEach(v => {
            document.getElementById(`${v}-view`).classList.add('hidden');
        });
        document.getElementById(`${viewId}-view`).classList.remove('hidden');
    }

    // بيانات دوري روشن السعودي المعتمدة لعام 2026م
    const standings2026 = [
        { rank: 1, team: "الهلال", played: 22, diff: "+38", pts: 58 },
        { rank: 2, team: "النصر", played: 22, diff: "+31", pts: 52 },
        { rank: 3, team: "الأهلي", played: 22, diff: "+24", pts: 46 },
        { rank: 4, team: "الاتحاد", played: 22, diff: "+19", pts: 42 },
        { rank: 5, team: "القادسية", played: 22, diff: "+14", pts: 39 },
        { rank: 6, team: "الشباب", played: 22, diff: "+10", pts: 36 },
        { rank: 7, team: "التعاون", played: 22, diff: "+6", pts: 33 },
        { rank: 8, team: "الاتفاق", played: 22, diff: "+2", pts: 31 },
        { rank: 9, team: "الفتح", played: 22, diff: "-1", pts: 28 },
        { rank: 10, team: "الفيحاء", played: 22, diff: "-4", pts: 26 },
        { rank: 11, team: "الرائد", played: 22, diff: "-7", pts: 24 },
        { rank: 12, team: "ضمك", played: 22, diff: "-9", pts: 23 },
        { rank: 13, team: "الخليج", played: 22, diff: "-11", pts: 22 },
        { rank: 14, team: "الوحدة", played: 22, diff: "-15", pts: 20 },
        { rank: 15, team: "الأخدود", played: 22, diff: "-18", pts: 19 },
        { rank: 16, team: "الرياض", played: 22, diff: "-21", pts: 17 },
        { rank: 17, team: "الحزم", played: 22, diff: "-26", pts: 14 },
        { rank: 18, team: "الطائي", played: 22, diff: "-32", pts: 12 }
    ];

    const scorers2026 = [
        { rank: 1, player: "كريستيانو رونالدو", team: "النصر", goals: 21 },
        { rank: 2, player: "ألكساندر ميتروفيتش", team: "الهلال", goals: 19 },
        { rank: 3, player: "كريم بنزيما", team: "الاتحاد", goals: 15 },
        { rank: 4, player: "إيفان توني", team: "الأهلي", goals: 14 },
        { rank: 5, player: "عبدالرزاق حمدالله", team: "الشباب", goals: 13 },
        { rank: 6, player: "بيير إيميريك أوباميانغ", team: "القادسية", goals: 12 },
        { rank: 7, player: "ساديو ماني", team: "النصر", goals: 10 },
        { rank: 8, player: "سالم الدوسري", team: "الهلال", goals: 9 }
    ];

    function render2026Data() {
        let tBody = document.getElementById('standings-data');
        tBody.innerHTML = '';
        standings2026.forEach(item => {
            let rankClass = item.rank === 1 ? 'top-1' : (item.rank <= 4 ? 'top-4' : '');
            tBody.innerHTML += `
                <tr>
                    <td><span class="rank-badge ${rankClass}">${item.rank}</span></td>
                    <td><strong>${item.team}</strong></td>
                    <td>${item.played}</td>
                    <td>${item.diff}</td>
                    <td style="color:#F59E0B; font-weight:bold;">${item.pts}</td>
                </tr>`;
        });

        let sBody = document.getElementById('scorers-data');
        sBody.innerHTML = '';
        scorers2026.forEach(item => {
            let rankClass = item.rank === 1 ? 'top-1' : (item.rank <= 3 ? 'top-4' : '');
            sBody.innerHTML += `
                <tr>
                    <td><span class="rank-badge ${rankClass}">${item.rank}</span></td>
                    <td><strong>${item.player}</strong></td>
                    <td>${item.team}</td>
                    <td style="color:#10B981; font-weight:bold;">${item.goals} ⚽</td>
                </tr>`;
        });
    }

    window.onload = render2026Data;
</script>

</body>
</html>
