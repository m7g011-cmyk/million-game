<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>إحصائيات دوري روشن السعودي 2026م ⚽</title>
    <style>
        * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
        body { 
            background: radial-gradient(circle, #1E1B4B 0%, #0F172A 100%); 
            color: white; 
            margin: 0; 
            padding: 12px; 
            display: flex; 
            justify-content: center; 
            min-height: 100vh; 
        }
        .roshan-card { 
            background: rgba(15, 23, 42, 0.95); 
            border: 2px solid #F59E0B; 
            border-radius: 20px; 
            padding: 16px; 
            width: 100%; 
            max-width: 500px; 
            text-align: center; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.8); 
        }
        h1 { color: #F59E0B; font-size: 20px; margin: 0 0 4px 0; }
        .season-badge { color: #10B981; font-size: 13px; font-weight: bold; margin-bottom: 12px; }
        
        .tab-bar { 
            display: flex; 
            gap: 4px; 
            background: #1E293B; 
            padding: 4px; 
            border-radius: 12px; 
            margin-bottom: 14px; 
            flex-wrap: wrap;
        }
        .tab-btn { 
            flex: 1 1 30%; 
            padding: 8px 4px; 
            border: none; 
            background: transparent; 
            color: #94A3B8; 
            font-size: 11px; 
            font-weight: bold; 
            border-radius: 8px; 
            cursor: pointer; 
            white-space: nowrap;
        }
        .tab-btn.active { background: #F59E0B; color: #000; }

        .table-container {
            max-height: 480px;
            overflow-y: auto;
            border: 1px solid #334155;
            border-radius: 12px;
        }

        table { width: 100%; border-collapse: collapse; font-size: 12px; text-align: right; }
        th, td { padding: 10px 8px; border-bottom: 1px solid #334155; }
        th { color: #F59E0B; background: #0F172A; position: sticky; top: 0; z-index: 2; }
        tr:nth-child(even) { background: rgba(255,255,255,0.03); }

        .rank-badge { 
            display: inline-block; 
            width: 22px; 
            height: 22px; 
            line-height: 22px; 
            text-align: center; 
            border-radius: 50%; 
            font-weight: bold; 
            font-size: 11px; 
        }
        .top-1 { background: #F59E0B; color: #000; }
        .top-4 { background: #10B981; color: #fff; }

        .btn-back {
            display: block;
            width: 100%;
            padding: 10px;
            margin-top: 14px;
            background: #334155;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
            font-size: 13px;
        }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="roshan-card">
    <h1>دوري روشن السعودي 🇸🇦 ⚽</h1>
    <div class="season-badge">موسم 2026م وطاقات فيفا 2027م</div>

    <!-- شريط الأزرار للتحويل بين الأقسام الستة -->
    <div class="tab-bar">
        <button class="tab-btn active" onclick="switchTab('standings', this)">الترتيب</button>
        <button class="tab-btn" onclick="switchTab('scorers', this)">الهدافين</button>
        <button class="tab-btn" onclick="switchTab('keepers', this)">أفضل الحراس</button>
        <button class="tab-btn" onclick="switchTab('assists', this)">المساعدات</button>
        <button class="tab-btn" onclick="switchTab('fifa', this)">طاقات فيفا 27</button>
        <button class="tab-btn" onclick="switchTab('contracts', this)">أغلى العقود 💰</button>
    </div>

    <!-- 1. جدول الترتيب -->
    <div id="standings-view" class="table-container">
        <table>
            <thead>
                <tr>
                    <th>#</th>
                    <th>الفريق</th>
                    <th>لعب</th>
                    <th>فارق</th>
                    <th>نقاط</th>
                </tr>
            </thead>
            <tbody id="standings-data"></tbody>
        </table>
    </div>

    <!-- 2. الهدافين -->
    <div id="scorers-view" class="table-container hidden">
        <table>
            <thead>
                <tr>
                    <th>#</th>
                    <th>اللاعب</th>
                    <th>الفريق</th>
                    <th>الأهداف</th>
                </tr>
            </thead>
            <tbody id="scorers-data"></tbody>
        </table>
    </div>

    <!-- 3. أفضل الحراس -->
    <div id="keepers-view" class="table-container hidden">
        <table>
            <thead>
                <tr>
                    <th>#</th>
                    <th>الحارس</th>
                    <th>الفريق</th>
                    <th>كلين شيت (شباك نظيفة)</th>
                </tr>
            </thead>
            <tbody id="keepers-data"></tbody>
        </table>
    </div>

    <!-- 4. المساعدات -->
    <div id="assists-view" class="table-container hidden">
        <table>
            <thead>
                <tr>
                    <th>#</th>
                    <th>اللاعب</th>
                    <th>الفريق</th>
                    <th>صناعة الأهداف</th>
                </tr>
            </thead>
            <tbody id="assists-data"></tbody>
        </table>
    </div>

    <!-- 5. طاقات فيفا 2027 (EA FC 27) -->
    <div id="fifa-view" class="table-container hidden">
        <table>
            <thead>
                <tr>
                    <th>#</th>
                    <th>اللاعب</th>
                    <th>الفريق</th>
                    <th>طاقة فيفا 27 🎮</th>
                </tr>
            </thead>
            <tbody id="fifa-data"></tbody>
        </table>
    </div>

    <!-- 6. أغلى العقود -->
    <div id="contracts-view" class="table-container hidden">
        <table>
            <thead>
                <tr>
                    <th>#</th>
                    <th>اللاعب</th>
                    <th>الفريق</th>
                    <th>العقد السنوي</th>
                </tr>
            </thead>
            <tbody id="contracts-data"></tbody>
        </table>
    </div>

    <a href="../index.html" class="btn-back">العودة للبوابة الرئيسية 🏠</a>
</div>

<script>
    function switchTab(viewId, btn) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');

        ['standings', 'scorers', 'keepers', 'assists', 'fifa', 'contracts'].forEach(v => {
            document.getElementById(`${v}-view`).classList.add('hidden');
        });
        document.getElementById(`${viewId}-view`).classList.remove('hidden');
    }

    // 1. بيانات الترتيب
    const standings2026 = [
        { rank: 1, team: "الهلال", played: 7, diff: "+18", pts: 18 },
        { rank: 2, team: "الاتحاد", played: 7, diff: "+6", pts: 17 },

        { rank: 4, team: "القادسية", played: 7, diff: "+8", pts: 16 },

    const scorers2026 = [

        { rank: 5, player: "ألكساندر ميتروفيتش", team: "الهلال", stat: "4 أهداف" }
    ];

    // 3. أفضل الحراس
    const keepers2026 = [
        { rank: 1, player: "ياسين بونو", team: "الهلال", stat: "3 مباريات" },
        { rank: 2, player: "مارسين بولكا", team: "نيوم", stat: "3 مباريات" },
        { rank: 3, player: "مايلسون", team: "التعاون", stat: "3 مباريات" },
        { rank: 4, player: "بريدراج رايكوفيتش", team: "الاتحاد", stat: "2 مباريات" },
        { rank: 5, player: "بينتو كريبسكي", team: "النصر", stat: "2 مباريات" }
    ];

    // 4. أفضل المساعدين
    const assists2026 = [
        { rank: 1, player: "روبن نيفيز", team: "الهلال", stat: "3 صناعة" },
        { rank: 2, player: "أوسكار رودريغيز", team: "الدرعية", stat: "3 صناعة" },
        { rank: 3, player: "جواو فيليكس", team: "النصر", stat: "2 صناعة" },
        { rank: 4, player: "حسام عوار", team: "الاتحاد", stat: "2 صناعة" },
        { rank: 5, player: "مصعب الجوير", team: "القادسية", stat: "2 صناعة" }
    ];

    // 5. طاقات فيفا 2027 (EA FC 27)
    const fifa2027 = [
        { rank: 1, player: "روبن نيفيز", team: "الهلال", stat: "86 ⚡" },
        { rank: 2, player: "سيرجاي سافيتش", team: "الهلال", stat: "85 ⚡" },
        { rank: 3, player: "كريستيانو رونالدو", team: "النصر", stat: "85 ⚡" },
        { rank: 4, player: "كريم بنزيما", team: "الاتحاد", stat: "85 ⚡" },
        { rank: 5, player: "نجولو كانتي", team: "الاتحاد", stat: "85 ⚡" },
        { rank: 6, player: "ياسين بونو", team: "الهلال", stat: "84 ⚡" },
        { rank: 7, player: "رياض محرز", team: "الأهلي", stat: "84 ⚡" },
        { rank: 8, player: "موسى ديابي", team: "الاتحاد", stat: "84 ⚡" },
        { rank: 9, player: "سالم الدوسري", team: "الهلال", stat: "82 ⚡" },
        { rank: 10, player: "سعد الموسى", team: "الاتحاد", stat: "79 ⚡" }
    ];

    // 6. أغلى العقود والمحترفين
    const contracts2026 = [
        { rank: 1, player: "كريستيانو رونالدو", team: "النصر", stat: "800 مليون ر.س (200M$)" },
        { rank: 2, player: "كريم بنزيما", team: "الاتحاد", stat: "400 مليون ر.س (100M$)" },
        { rank: 3, player: "رياض محرز", team: "الأهلي", stat: "210 مليون ر.س (52M$)" },
        { rank: 4, player: "ساديو ماني", team: "النصر", stat: "160 مليون ر.س (40M$)" },
        { rank: 5, player: "سيرجاي سافيتش", team: "الهلال", stat: "100 مليون ر.س (25M$)" },
        { rank: 6, player: "ألكساندر ميتروفيتش", team: "الهلال", stat: "100 مليون ر.س (25M$)" },
        { rank: 7, player: "إيفان توني", team: "الأهلي", stat: "90 مليون ر.س (22M$)" },
        { rank: 8, player: "نجولو كانتي", team: "الاتحاد", stat: "100 مليون ر.س (25M$)" },
        { rank: 9, player: "روبن نيفيز", team: "الهلال", stat: "75 مليون ر.س (18M$)" },
        { rank: 10, player: "جواو كانسيلو", team: "الهلال", stat: "65 مليون ر.س (15M$)" }
    ];

    function renderTable(containerId, list, isStandings = false) {
        let tbody = document.getElementById(containerId);
        tbody.innerHTML = '';
        list.forEach(item => {
            let rankClass = item.rank === 1 ? 'top-1' : (item.rank <= 3 ? 'top-4' : '');
            if (isStandings) {
                tbody.innerHTML += `
                    <tr>
                        <td><span class="rank-badge ${rankClass}">${item.rank}</span></td>
                        <td><strong>${item.team}</strong></td>
                        <td>${item.played}</td>
                        <td>${item.diff}</td>
                        <td style="color:#F59E0B; font-weight:bold;">${item.pts}</td>
                    </tr>`;
            } else {
                tbody.innerHTML += `
                    <tr>
                        <td><span class="rank-badge ${rankClass}">${item.rank}</span></td>
                        <td><strong>${item.player}</strong></td>
                        <td>${item.team}</td>
                        <td style="color:#10B981; font-weight:bold;">${item.stat}</td>
                    </tr>`;
            }
        });
    }

    window.onload = function() {
        renderTable('standings-data', standings2026, true);
        renderTable('scorers-data', scorers2026);
        renderTable('keepers-data', keepers2026);
        renderTable('assists-data', assists2026);
        renderTable('fifa-data', fifa2027);
        renderTable('contracts-data', contracts2026);
    };
</script>

</body>
</html>
