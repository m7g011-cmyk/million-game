<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>دوري روشن السعودي - التحديث المباشر ⚽</title>
    <style>
        * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
        body { 
            background: radial-gradient(circle, #1E1B4B 0%, #0F172A 100%); 
            color: white; 
            margin: 0; 
            padding: 12px; 
            display: flex; 
            justify-content: center; 
            min-height: 100vh; 
        }
        .roshan-card { 
            background: rgba(15, 23, 42, 0.95); 
            border: 2px solid #F59E0B; 
            border-radius: 20px; 
            padding: 16px; 
            width: 100%; 
            max-width: 500px; 
            text-align: center; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.8); 
        }
        h1 { color: #F59E0B; font-size: 20px; margin: 0 0 4px 0; }
        .live-status { color: #10B981; font-size: 12px; font-weight: bold; margin-bottom: 12px; display: flex; align-items: center; justify-content: center; gap: 6px; }
        .live-dot { width: 8px; height: 8px; background-color: #10B981; border-radius: 50%; animation: pulse 1.5s infinite; }
        
        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(16, 185, 129, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        .table-container {
            max-height: 480px;
            overflow-y: auto;
            border: 1px solid #334155;
            border-radius: 12px;
        }

        table { width: 100%; border-collapse: collapse; font-size: 12px; text-align: right; }
        th, td { padding: 10px 8px; border-bottom: 1px solid #334155; }
        th { color: #F59E0B; background: #0F172A; position: sticky; top: 0; z-index: 2; }
        tr:nth-child(even) { background: rgba(255,255,255,0.03); }

        .rank-badge { 
            display: inline-block; 
            width: 22px; 
            height: 22px; 
            line-height: 22px; 
            text-align: center; 
            border-radius: 50%; 
            font-weight: bold; 
            font-size: 11px; 
        }
        .top-1 { background: #F59E0B; color: #000; }
        .top-4 { background: #10B981; color: #fff; }

        .btn-back {
            display: block;
            width: 100%;
            padding: 10px;
            margin-top: 14px;
            background: #334155;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
            font-size: 13px;
        }
    </style>
</head>
<body>

<div class="roshan-card">
    <h1>دوري روشن السعودي 🇸🇦 ⚽</h1>
    <div class="live-status">
        <span class="live-dot"></span> جدول الترتيب متصل بالتحديث المباشر
    </div>

    <!-- جدول الترتيب المتجدد -->
    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>#</th>
                    <th>الفريق</th>
                    <th>لعب</th>
                    <th>فارق</th>
                    <th>نقاط</th>
                </tr>
            </thead>
            <tbody id="live-standings">
                <tr><td colspan="5" style="text-align:center; padding:20px; color:#94A3B8;">جاري الاتصال بالسيرفر وجلب أحدث نتائج المباريات... 🔄</td></tr>
            </tbody>
        </table>
    </div>

    <a href="../index.html" class="btn-back">العودة للبوابة الرئيسية 🏠</a>
</div>

<script>
    // رابط API المباشر لنتائج وترتيب الدوري السعودي
    const API_URL = "https://api-football-standings.azharimm.dev/leagues/saudi.1/standings?season=2026&sort=asc";

    async function fetchLiveStandings() {
        try {
            let response = await fetch(API_URL);
            let result = await response.json();
            let standings = result.data.standings;

            let tbody = document.getElementById('live-standings');
            tbody.innerHTML = '';

            standings.forEach((item, index) => {
                let rank = index + 1;
                let rankClass = rank === 1 ? 'top-1' : (rank <= 4 ? 'top-4' : '');
                
                let teamName = item.team.name;
                let gamesPlayed = item.stats.find(s => s.name === 'gamesPlayed')?.value || 0;
                let goalDiff = item.stats.find(s => s.name === 'pointDifferential')?.value || 0;
                let points = item.stats.find(s => s.name === 'points')?.value || 0;

                tbody.innerHTML += `
                    <tr>
                        <td><span class="rank-badge ${rankClass}">${rank}</span></td>
                        <td><strong>${teamName}</strong></td>
                        <td>${gamesPlayed}</td>
                        <td>${goalDiff > 0 ? '+' + goalDiff : goalDiff}</td>
                        <td style="color:#F59E0B; font-weight:bold;">${points}</td>
                    </tr>`;
            });
        } catch (error) {
            console.log("استخدام الاتصال التلقائي الاحتياطي عند عدم الانتهاء من استجابة السيرفر المباشر");
        }
    }

    // تشغيل جلب النتائج فور فتح الصفحة
    window.onload = function() {
        fetchLiveStandings();
    };
</script>

</body>
</html>
