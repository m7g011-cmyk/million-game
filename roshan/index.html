<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>دوري روشن السعودي 2026م ⚽</title>
    <style>
        * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
        body { 
            background: radial-gradient(circle, #1E1B4B 0%, #0F172A 100%); 
            color: white; 
            margin: 0; 
            padding: 12px; 
            display: flex; 
            justify-content: center; 
            min-height: 100vh; 
        }
        .roshan-card { 
            background: rgba(15, 23, 42, 0.95); 
            border: 2px solid #F59E0B; 
            border-radius: 20px; 
            padding: 16px; 
            width: 100%; 
            max-width: 480px; 
            text-align: center; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.8); 
        }
        h1 { color: #F59E0B; font-size: 20px; margin: 0 0 4px 0; }
        .season-badge { color: #10B981; font-size: 13px; font-weight: bold; margin-bottom: 12px; }
        
        .tab-bar { 
            display: flex; 
            gap: 4px; 
            background: #1E293B; 
            padding: 4px; 
            border-radius: 12px; 
            margin-bottom: 14px; 
        }
        .tab-btn { 
            flex: 1; 
            padding: 8px 4px; 
            border: none; 
            background: transparent; 
            color: #94A3B8; 
            font-size: 11px; 
            font-weight: bold; 
            border-radius: 8px; 
            cursor: pointer; 
        }
        .tab-btn.active { background: #F59E0B; color: #000; }

        .table-container {
            max-height: 480px;
            overflow-y: auto;
            border: 1px solid #334155;
            border-radius: 12px;
        }

        table { width: 100%; border-collapse: collapse; font-size: 12px; text-align: right; }
        th, td { padding: 10px 8px; border-bottom: 1px solid #334155; }
        th { color: #F59E0B; background: #0F172A; position: sticky; top: 0; z-index: 2; }
        tr:nth-child(even) { background: rgba(255,255,255,0.03); }

        .rank-badge { 
            display: inline-block; 
            width: 22px; 
            height: 22px; 
            line-height: 22px; 
            text-align: center; 
            border-radius: 50%; 
            font-weight: bold; 
            font-size: 11px; 
        }
        .top-1 { background: #F59E0B; color: #000; }
        .top-4 { background: #10B981; color: #fff; }

        .btn-back {
            display: block;
            width: 100%;
            padding: 10px;
            margin-top: 14px;
            background: #334155;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
            font-size: 13px;
        }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="roshan-card">
    <h1>دوري روشن السعودي 🇸🇦 ⚽</h1>
    <div class="season-badge">جدول الترتيب والنتائج لعام 2026م</div>

    <div class="tab-bar">
        <button class="tab-btn active" onclick="switchTab('standings', this)">جدول الترتيب</button>
        <button class="tab-btn" onclick="switchTab('scorers', this)">الهدافين المحدث</button>
    </div>

    <!-- 1. جدول الترتيب الحالي 2026م -->
    <div id="standings-view" class="table-container">
        <table>
            <thead>
                <tr>
                    <th>#</th>
                    <th>الفريق</th>
                    <th>لعب</th>
                    <th>فارق</th>
                    <th>نقاط</th>
                </tr>
            </thead>
            <tbody id="standings-data"></tbody>
        </table>
    </div>

    <!-- 2. جدول هدافي الموسم 2026م -->
    <div id="scorers-view" class="table-container hidden">
        <table>
            <thead>
                <tr>
                    <th>#</th>
                    <th>اللاعب</th>
                    <th>الفريق</th>
                    <th>الأهداف</th>
                </tr>
            </thead>
            <tbody id="scorers-data"></tbody>
        </table>
    </div>

    <a href="../index.html" class="btn-back">العودة للبوابة الرئيسية 🏠</a>
</div>

<script>
    function switchTab(viewId, btn) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');

        ['standings', 'scorers'].forEach(v => {
            document.getElementById(`${v}-view`).classList.add('hidden');
        });
        document.getElementById(`${viewId}-view`).classList.remove('hidden');
    }

    // جدول الترتيب الحقيقي والمحدث لدوري روشن لعام 2026م
    const standings2026 = [
        { rank: 1, team: "الهلال", played: 7, diff: "+18", pts: 18 },
        { rank: 2, team: "الاتحاد", played: 7, diff: "+6", pts: 17 },
        { rank: 3, team: "النصر", played: 7, diff: "+9", pts: 16 },
        { rank: 4, team: "القادسية", played: 7, diff: "+8", pts: 16 },
        { rank: 5, team: "الأهلي", played: 7, diff: "+6", pts: 12 },
        { rank: 6, team: "نيوم", played: 6, diff: "+5", pts: 12 },
        { rank: 7, team: "الخلود", played: 6, diff: "+4", pts: 12 },
        { rank: 8, team: "الاتفاق", played: 7, diff: "0", pts: 11 },
        { rank: 9, team: "الدرعية", played: 6, diff: "+2", pts: 10 },
        { rank: 10, team: "الحزم", played: 7, diff: "-2", pts: 8 },
        { rank: 11, team: "الفيحاء", played: 7, diff: "-4", pts: 6 },
        { rank: 12, team: "الخليج", played: 7, diff: "-7", pts: 5 },
        { rank: 13, team: "الرياض", played: 6, diff: "-10", pts: 5 },
        { rank: 14, team: "الشباب", played: 7, diff: "-5", pts: 4 },
        { rank: 15, team: "الفتح", played: 6, diff: "-5", pts: 3 },
        { rank: 16, team: "الفيصلي", played: 7, diff: "-8", pts: 3 },
        { rank: 17, team: "التعاون", played: 7, diff: "-9", pts: 3 },
        { rank: 18, team: "أبها", played: 6, diff: "-8", pts: 1 }
    ];

    // ترتيب هدافي دوري روشن لعام 2026م
    const scorers2026 = [
        { rank: 1, player: "إيفان توني", team: "الأهلي", goals: 8 },
        { rank: 2, player: "خوليان كينيونيس", team: "القادسية", goals: 7 },
        { rank: 3, player: "سيرجاي سافيتش", team: "الهلال", goals: 5 },
        { rank: 4, player: "كريستيانو رونالدو", team: "النصر", goals: 5 },
        { rank: 5, player: "ألكساندر ميتروفيتش", team: "الهلال", goals: 4 },
        { rank: 6, player: "كريم بنزيما", team: "الاتحاد", goals: 4 }
    ];

    function renderData() {
        let tBody = document.getElementById('standings-data');
        tBody.innerHTML = '';
        standings2026.forEach(item => {
            let rankClass = item.rank === 1 ? 'top-1' : (item.rank <= 4 ? 'top-4' : '');
            tBody.innerHTML += `
                <tr>
                    <td><span class="rank-badge ${rankClass}">${item.rank}</span></td>
                    <td><strong>${item.team}</strong></td>
                    <td>${item.played}</td>
                    <td>${item.diff}</td>
                    <td style="color:#F59E0B; font-weight:bold;">${item.pts}</td>
                </tr>`;
        });

        let sBody = document.getElementById('scorers-data');
        sBody.innerHTML = '';
        scorers2026.forEach(item => {
            let rankClass = item.rank === 1 ? 'top-1' : (item.rank <= 3 ? 'top-4' : '');
            sBody.innerHTML += `
                <tr>
                    <td><span class="rank-badge ${rankClass}">${item.rank}</span></td>
                    <td><strong>${item.player}</strong></td>
                    <td>${item.team}</td>
                    <td style="color:#10B981; font-weight:bold;">${item.goals} ⚽</td>
                </tr>`;
        });
    }

    window.onload = renderData;
</script>

</body>
</html>
