<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ترتيب دوري روشن السعودي ⚽</title>
    <style>
        * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
        body { 
            background: radial-gradient(circle, #1E1B4B 0%, #0F172A 100%); 
            color: white; 
            margin: 0; 
            padding: 12px; 
            display: flex; 
            justify-content: center; 
            min-height: 100vh; 
        }
        .roshan-card { 
            background: rgba(15, 23, 42, 0.95); 
            border: 2px solid #F59E0B; 
            border-radius: 20px; 
            padding: 16px; 
            width: 100%; 
            max-width: 480px; 
            text-align: center; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.8); 
        }
        h1 { color: #F59E0B; font-size: 20px; margin: 0 0 12px 0; }
        
        .tab-bar { 
            display: flex; 
            gap: 4px; 
            background: #1E293B; 
            padding: 4px; 
            border-radius: 12px; 
            margin-bottom: 14px; 
        }
        .tab-btn { 
            flex: 1; 
            padding: 8px 4px; 
            border: none; 
            background: transparent; 
            color: #94A3B8; 
            font-size: 11px; 
            font-weight: bold; 
            border-radius: 8px; 
            cursor: pointer; 
        }
        .tab-btn.active { background: #F59E0B; color: #000; }

        table { width: 100%; border-collapse: collapse; font-size: 12px; text-align: right; }
        th, td { padding: 8px 6px; border-bottom: 1px solid #334155; }
        th { color: #F59E0B; background: #0F172A; }
        tr:nth-child(even) { background: rgba(255,255,255,0.03); }

        .rank-num { font-weight: bold; color: #F59E0B; text-align: center; width: 24px; }
        .team-name { font-weight: bold; }

        .btn-back {
            display: block;
            width: 100%;
            padding: 10px;
            margin-top: 14px;
            background: #334155;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
            font-size: 13px;
        }
        .hidden { display: none; }
        
        .widget-frame {
            width: 100%;
            height: 520px;
            border: none;
            border-radius: 12px;
            background: #FFF;
        }
    </style>
</head>
<body>

<div class="roshan-card">
    <h1>دوري روشن السعودي 🇸🇦 ⚽</h1>

    <!-- شريط التنقل بين الإحصائيات -->
    <div class="tab-bar">
        <button class="tab-btn active" onclick="switchTab('standings', this)">الترتيب والنتائج الحية</button>
        <button class="tab-btn" onclick="switchTab('scorers', this)">الهدافين والمساعدين</button>
    </div>

    <!-- 1. جدول ترتيب الدوري الحقيقي والتفاعلي -->
    <div id="standings-view">
        <iframe class="widget-frame" src="https://widget.fotmob.com/m/table?id=9292"></iframe>
    </div>

    <!-- 2. جدول الهدافين والمصنعين الحقيقي والتفاعلي -->
    <div id="scorers-view" class="hidden">
        <iframe class="widget-frame" src="https://widget.fotmob.com/m/stats?id=9292"></iframe>
    </div>

    <a href="../index.html" class="btn-back">العودة للبوابة الرئيسية 🏠</a>
</div>

<script>
    function switchTab(viewId, btn) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');

        ['standings', 'scorers'].forEach(v => {
            document.getElementById(`${v}-view`).classList.add('hidden');
        });
        document.getElementById(`${viewId}-view`).classList.remove('hidden');
    }
</script>

</body>
</html>
